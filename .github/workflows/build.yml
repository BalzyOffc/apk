name: Build Mini Chat APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'Mini-Chat-Android-GitHub-Actions.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'
  PROJECT_DIR: 'extracted/minichat-android'

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          test -f Mini-Chat-Android-GitHub-Actions.zip
          mkdir -p extracted
          unzip -q Mini-Chat-Android-GitHub-Actions.zip -d extracted
          test -f "$PROJECT_DIR/package.json"
          test -f "$PROJECT_DIR/www/index.html"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: extracted/minichat-android
        run: npm install

      - name: Generate Android project
        working-directory: extracted/minichat-android
        run: npx cap add android

      - name: Add Android permissions
        working-directory: extracted/minichat-android
        run: node scripts/patch-android-manifest.mjs

      - name: Sync web source to Android
        working-directory: extracted/minichat-android
        run: npx cap sync android

      - name: Build APK
        working-directory: extracted/minichat-android/android
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mini-Chat-Android-APK
          path: extracted/minichat-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
 
